site:
  title: 重訓課表大總表
  title_en: Strength Training Library & Master Schedule
  subtitle: 依訓練部位分類的重訓動作庫，各單日課表由此串連細節

categories:
- code: '01'
  title_zh: 上肢推
  title_en: Upper Push
  focus: 建立胸、肩、三頭肌群的推力與穩定度。
  exercises:
  - id: 1
    title_zh: 槓鈴臥推
    title_en: Barbell Bench Press
    default_sets: 4
    default_reps: '6-8'
    default_rest_seconds: 120
    method:
    - 躺上臥推椅，雙腳踩穩地面，肩胛骨下壓後收。
    - 握距略寬於肩，下放至胸口上方，手肘約 45 度角。
    - 推起時全程收緊核心，避免腰部過度拱起。
    points:
    - 下放時控制速度，避免彈震。
    - 鎖定肩胛穩定再推起。
    summary: 複合推力動作，主練胸大肌、前三角肌與肱三頭肌。
  - id: 12
    title_zh: 啞鈴臥推
    title_en: Dumbbell Bench Press
    default_sets: 4
    default_reps: '8-10'
    default_rest_seconds: 90
    method:
    - 躺在平板凳或地面，雙手持啞鈴置於胸側，掌心朝前方或相對。
    - 啞鈴往上推至手臂接近伸直，啞鈴於胸口正上方對齊。
    - 緩慢下放至啞鈴貼近胸側，手肘約 45 度角。
    points:
    - 全程收緊核心，避免腰部過度拱起。
    - 下放時控制速度，不借力彈震。
    summary: 複合推力動作，主練胸大肌、前三角肌與肱三頭肌，啞鈴版本可加大活動範圍。
  - id: 2
    title_zh: 啞鈴肩推
    title_en: Dumbbell Shoulder Press
    default_sets: 4
    default_reps: '8-10'
    default_rest_seconds: 90
    method:
    - 坐姿或站姿皆可，啞鈴置於肩側，手肘略朝前。
    - 垂直向上推至手臂接近伸直，勿鎖死肘關節。
    - 緩慢下放回到起始位置。
    points:
    - 核心收緊避免腰椎過度伸展。
    - 肩胛保持穩定，不要聳肩代償。
    summary: 主練三角肌，建立肩部推力與穩定度。
  - id: 3
    title_zh: 伏地挺身
    title_en: Push-up
    default_sets: 3
    default_reps: '12-15'
    default_rest_seconds: 60
    method:
    - 雙手略寬於肩，身體呈一直線。
    - 下放至胸口接近地面，手肘約 45 度角。
    - 推起全程保持核心與臀部收緊。
    points:
    - 避免塌腰或翹臀。
    - 可墊高雙手降低難度，或墊高雙腳提升難度。
    summary: 自體重推力動作，適合作為熱身或收尾。

- code: '02'
  title_zh: 上肢拉
  title_en: Upper Pull
  focus: 建立背部、二頭肌群的拉力與姿勢穩定度。
  exercises:
  - id: 4
    title_zh: 槓鈴划船
    title_en: Barbell Row
    default_sets: 4
    default_reps: '8-10'
    default_rest_seconds: 90
    method:
    - 髖關節鉸鏈前傾，背部打直，膝蓋微彎。
    - 將槓鈴拉向下腹，手肘貼近身體。
    - 控制下放，避免借用腰部晃動發力。
    points:
    - 全程維持中立脊椎。
    - 用背部發力拉動，而非只靠手臂。
    summary: 複合拉力動作，主練背闊肌與中背肌群。
  - id: 5
    title_zh: 滑輪下拉
    title_en: Lat Pulldown
    default_sets: 4
    default_reps: '10-12'
    default_rest_seconds: 75
    method:
    - 握距略寬於肩，上半身微後傾。
    - 將橫桿拉至鎖骨上方，夾緊肩胛骨。
    - 緩慢回到起始位置，手臂完全伸展。
    points:
    - 避免用身體後仰借力。
    - 感受背闊肌收縮而非手臂代償。
    summary: 引體向上的替代動作，主練背闊肌。
  - id: 6
    title_zh: 啞鈴二頭彎舉
    title_en: Dumbbell Bicep Curl
    default_sets: 3
    default_reps: '10-12'
    default_rest_seconds: 60
    method:
    - 站姿，手臂自然下垂，掌心朝前。
    - 彎舉至啞鈴接近肩膀，手肘固定不前後晃動。
    - 緩慢下放至起始位置。
    points:
    - 避免借用身體擺盪發力。
    - 全程控制速度，尤其是離心階段。
    summary: 孤立動作，主練肱二頭肌。
  - id: 13
    title_zh: 啞鈴划船（單臂）
    title_en: One-Arm Dumbbell Row
    default_sets: 4
    default_reps: '10-12/邊'
    default_rest_seconds: 90
    method:
    - 單手扶穩平板凳或椅背，同側膝蓋跪於凳上，背部打平與地面平行。
    - 另一手持啞鈴，手臂自然下垂，啞鈴拉向腰側，手肘貼近身體。
    - 緩慢下放至手臂完全伸展，感受背闊肌伸展後再拉起。
    points:
    - 避免用軀幹扭轉借力，肩胛主動下壓後收。
    - 兩側分別完成組數，弱側可額外加做。
    summary: 單臂拉系動作，直接訓練引體向上所需的背闊肌與握力。

- code: '03'
  title_zh: 下肢
  title_en: Lower Body
  focus: 建立股四頭肌、臀肌、腿後肌群的力量與穩定度。
  exercises:
  - id: 7
    title_zh: 槓鈴背蹲舉
    title_en: Barbell Back Squat
    default_sets: 4
    default_reps: '5-8'
    default_rest_seconds: 150
    method:
    - 槓鈴置於上背斜方肌，雙腳與肩同寬或略寬。
    - 髖、膝同時彎曲下蹲，直到大腿與地面平行或更低。
    - 腳跟發力站起，全程核心收緊。
    points:
    - 膝蓋方向與腳尖一致，避免內夾。
    - 下蹲過程保持胸口朝上、脊椎中立。
    summary: 下肢力量基礎動作，主練股四頭肌與臀肌。
  - id: 8
    title_zh: 羅馬尼亞硬舉
    title_en: Romanian Deadlift
    default_sets: 4
    default_reps: '8-10'
    default_rest_seconds: 120
    method:
    - 雙手握槓，站姿與肩同寬，膝蓋微彎固定。
    - 髖關節向後鉸鏈，上半身前傾，槓鈴貼近小腿下放。
    - 感受腿後肌群與臀部拉伸後，髖部發力站起。
    points:
    - 全程背部打直，避免駝背。
    - 感受腿後側張力而非只靠下背出力。
    summary: 髖主導動作，主練腿後肌群與臀大肌。
  - id: 9
    title_zh: 保加利亞分腿蹲
    title_en: Bulgarian Split Squat
    default_sets: 3
    default_reps: '10-12'
    default_rest_seconds: 90
    method:
    - 後腳置於穩定平台，前腳與平台保持約一步半距離。
    - 下蹲至前腿大腿接近水平，後膝輕觸地面上方。
    - 前腳腳跟發力站起。
    points:
    - 軀幹保持直立，避免過度前傾。
    - 單邊訓練，兩側分別完成組數。
    summary: 單邊訓練動作，加強下肢穩定度與臀肌。

- code: '04'
  title_zh: 核心
  title_en: Core
  focus: 建立軀幹穩定度與抗旋轉能力。
  exercises:
  - id: 10
    title_zh: 棒式
    title_en: Plank
    default_sets: 3
    default_reps: '45-60 秒'
    default_rest_seconds: 45
    method:
    - 前臂與腳尖撐地，身體呈一直線。
    - 收緊核心與臀部，避免塌腰或翹臀。
    - 維持穩定呼吸，計時撐住。
    points:
    - 下巴微收，避免抬頭。
    - 若感到下背痠痛，先縮短時間並檢查姿勢。
    summary: 等長核心訓練，建立軀幹穩定度。
  - id: 11
    title_zh: 死蟲式
    title_en: Dead Bug
    default_sets: 3
    default_reps: '10-12 下/邊'
    default_rest_seconds: 45
    method:
    - 仰躺，雙手舉向天花板，雙腿屈膝呈 90 度。
    - 對側手腳緩慢向外伸展並下放，下背貼緊地面。
    - 回到起始位置後換邊重複。
    points:
    - 全程維持下背貼地，避免代償拱腰。
    - 動作放慢，強調控制而非速度。
    summary: 抗伸展核心訓練，強化軀幹控制能力。

- code: '05'
  title_zh: 引體向上專項
  title_en: Pull-up Specialization
  focus: 針對引體向上建立獨立的漸進式訓練軌道，從離心控制、輔助減量到全程自體重完成。
  exercises:
  - id: 14
    title_zh: 引體向上離心
    title_en: Negative Pull-up
    default_sets: 3
    default_reps: '3-5'
    default_rest_seconds: 90
    method:
    - 使用跳躍、踏階或椅子輔助，直接讓下巴到達單槓上方的頂端位置。
    - 盡量放慢下放速度（目標 3-5 秒），直到手臂完全伸直。
    - 回到起始姿勢後重複，每下都從頂端開始下放。
    points:
    - 全程保持核心收緊，避免身體擺盪。
    - 下放速度是重點，寧可少下數但放慢。
    summary: 建立拉系離心控制力，是全程引體向上前的關鍵準備動作。
  - id: 15
    title_zh: 輔助引體向上機
    title_en: Assisted Pull-up Machine
    default_sets: 4
    default_reps: '6-10'
    default_rest_seconds: 90
    method:
    - 雙膝或雙腳踩上機器平台，設定輔助重量（輔助重量愈高，動作愈輕鬆）。
    - 雙手正握握把，拉起至下巴過槓，頂端稍停夾緊背部。
    - 緩慢下放至手臂完全伸展，再進行下一下。
    points:
    - 隨著能力進步調低輔助重量，逐步逼近自身體重。
    - 避免用腳蹬平台借力，發力重點放在背部。
    summary: 可精確調整輔助重量的引體向上訓練，銜接離心訓練與全程動作。
  - id: 16
    title_zh: 死掛
    title_en: Dead Hang
    default_sets: 3
    default_reps: '20-30 秒'
    default_rest_seconds: 60
    method:
    - 雙手正握單槓，與肩同寬，身體自然懸吊放鬆肩膀。
    - 保持核心微收，避免身體大幅擺盪。
    - 維持穩定呼吸，計時撐住後放下休息。
    points:
    - 感受肩胛與握力的張力，而非聳肩代償。
    - 握不住時可提早放下，避免摔落受傷。
    summary: 強化握力與肩胛穩定度，是引體向上的基礎支撐能力。
  - id: 17
    title_zh: 引體向上
    title_en: Pull-up
    default_sets: 3
    default_reps: 'AMRAP'
    default_rest_seconds: 120
    method:
    - 雙手正握單槓，略寬於肩，身體自然懸吊。
    - 拉起至下巴過槓，頂端稍停夾緊背部。
    - 緩慢下放至手臂完全伸展，再進行下一下。
    points:
    - 全程避免大幅擺盪借力。
    - 做到力竭前的最後一下仍保持標準動作再停止。
    summary: 全程自體重拉系動作，是引體向上專項訓練的最終測試動作。
