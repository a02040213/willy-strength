export_defaults:
  header: 💪 {date} 重訓課表 {label}
  base_url: https://a02040213.github.io/willy-strength/
  footer: 如有不適請立即停止。表中重量是依目前數據回推的起點（單臂划船、滑輪下拉、輔助引體向上機的機器數字因場館而異，第一次請實際測試後再微調），做得到就維持、做不到先降一階，有需要在表格留言我再改。

